version: '3.8'

networks:
  ticket-network:
    driver: bridge

services:
  # VERİTABANI 
  db:
    image: postgres:15-alpine
    container_name: ticket-db
    restart: always
    networks:
      - ticket-network
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data # 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # REDIS 
  redis:
    image: redis:alpine
    container_name: ticket-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ticket-network

  # ZOOKEEPER 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ticket-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ticket-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data 
      - zookeeper-log:/var/lib/zookeeper/log

  # KAFKA 
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ticket-kafka
    restart: always
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 30 -b localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-network
    volumes:
      - kafka-data:/var/lib/kafka/data 

  # BACKEND 
  backend:
    build: ./ticket-app
    container_name: ticket-backend
    restart: on-failure
    networks:
      - ticket-network
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://ticket-db:5432/ticketdb
      DB_USERNAME: postgres
      DB_PASSWORD: password123
      JWT_SECRET: BuCokGizliVeUzunBirJwtSifresidirLutfenDegistir123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_REDIS_URL: redis://redis:6379
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - db
      - kafka
      - redis

  # FRONTEND
  frontend:
    build: ./ticketapp-frontend
    container_name: ticket-frontend
    restart: always
    networks:
      - ticket-network
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    depends_on:
      - backend
    volumes:
      - ./ticketapp-frontend:/app
      - /app/node_modules
      

# VOLUMES
volumes:
  db-data:           
  zookeeper-data: 
  zookeeper-log:  
  kafka-data:     
  
